global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gitea'
    static_configs:
      - targets: ['gitea:3000']
    metrics_path: /metrics

  - job_name: 'git-parser'
    static_configs:
      - targets: ['git-parser:8080']
    metrics_path: /metrics

  - job_name: 'asset-manager'
    static_configs:
      - targets: ['asset-manager:8082']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
