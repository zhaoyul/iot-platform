; Forgejo Configuration for Industrial DevOps Platform
; This configuration integrates advanced features for managing
; industrial assets, PLC code, and binary files

[server]
APP_NAME = Industrial DevOps Platform
DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
; Enable Git LFS for large binary files (firmware, CAD, PLC files)
LFS_START_SERVER = true
LFS_JWT_SECRET = changeme-generate-with-forgejo-generate-secret-JWT_SECRET

[database]
DB_TYPE = postgres
HOST = db:5432
NAME = forgejo
USER = forgejo
PASSWD = forgejo
SCHEMA = 
SSL_MODE = disable
CHARSET = utf8mb4
LOG_SQL = false

[repository]
ROOT = /data/git/repositories
; Enable Reftable backend for high-performance reference storage
DEFAULT_REPO_UNITS = repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects
; Support for large repositories with many refs
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true
; Default branch protection
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
SECRET_KEY = changeme-generate-with-forgejo-generate-secret-SECRET_KEY
; Enable SSH certificate-based authentication
SSH_SERVER_CIPHERS = chacha20-poly1305@openssh.com, aes128-ctr, aes192-ctr, aes256-ctr, aes128-gcm@openssh.com, aes256-gcm@openssh.com
SSH_SERVER_KEY_EXCHANGES = curve25519-sha256, ecdh-sha2-nistp256, ecdh-sha2-nistp384, ecdh-sha2-nistp521, diffie-hellman-group14-sha256, diffie-hellman-group14-sha1
SSH_SERVER_MACS = hmac-sha2-256-etm@openssh.com, hmac-sha2-256, hmac-sha1

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true

[lfs]
; Configure MinIO S3-compatible storage for LFS objects
STORAGE_TYPE = minio
; Separate binary blobs from Git metadata for performance
MINIO_ENDPOINT = minio:9000
MINIO_ACCESS_KEY_ID = minioadmin
MINIO_SECRET_ACCESS_KEY = minioadmin
MINIO_BUCKET = forgejo-lfs
MINIO_LOCATION = us-east-1
MINIO_USE_SSL = false
; Enable file locking for binary PLC files that cannot be merged
LFS_LOCKS_PAGING_NUM = 50

[oauth2]
; Integration with Keycloak for enterprise SSO and MFA
ENABLE = true

; External renderers for industrial file formats
[markup.jupyter]
ENABLED = true
FILE_EXTENSIONS = .ipynb
RENDER_COMMAND = "jupyter nbconvert --stdin --stdout --to html --template basic"
IS_INPUT_FILE = false
RENDER_CONTENT_MODE = iframe

[markup.plc-l5x]
ENABLED = true
FILE_EXTENSIONS = .l5x
RENDER_COMMAND = "/usr/local/bin/render-l5x"
IS_INPUT_FILE = true
RENDER_CONTENT_MODE = iframe

[markup.plc-acd]
ENABLED = true
FILE_EXTENSIONS = .acd
RENDER_COMMAND = "/usr/local/bin/render-acd"
IS_INPUT_FILE = true
RENDER_CONTENT_MODE = iframe

[markup.structured-text]
ENABLED = true
FILE_EXTENSIONS = .st,.scl
RENDER_COMMAND = "/usr/local/bin/render-st"
IS_INPUT_FILE = true
RENDER_CONTENT_MODE = iframe

[git]
; Disable size limits for industrial assets
MAX_GIT_DIFF_LINES = 10000
MAX_GIT_DIFF_LINE_CHARACTERS = 5000
MAX_GIT_DIFF_FILES = 100

[git.timeout]
; Increase timeouts for large binary file operations
DEFAULT = 360
MIGRATE = 600
MIRROR = 300
CLONE = 300
PULL = 300
GC = 60

[actions]
; Enable GitHub Actions-compatible CI/CD
ENABLED = true
DEFAULT_ACTIONS_URL = https://github.com

[log]
MODE = console,file
LEVEL = Info
ROOT_PATH = /data/gitea/log
; Enable audit logging for compliance
ENABLE_ACCESS_LOG = true
ENABLE_XORM_LOG = false

[audit]
; Detailed audit logging for security compliance (IEC 62443, ISO 27001)
ENABLE = true

[cors]
; Allow frontend visualization components
ENABLED = true
SCHEME = http
ALLOW_DOMAIN = *
ALLOW_SUBDOMAIN = true
METHODS = GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
MAX_AGE = 10m
ALLOW_CREDENTIALS = false

[webhook]
; Enable webhooks for GitOps automation
ALLOWED_HOST_LIST = *
