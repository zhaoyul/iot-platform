input {
  # Accept logs from Forgejo via syslog
  syslog {
    port => 5000
    type => "forgejo"
  }
  
  # Accept logs from Docker containers
  tcp {
    port => 5001
    codec => json
    type => "docker"
  }
}

filter {
  # Parse Forgejo access logs
  if [type] == "forgejo" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    geoip {
      source => "clientip"
    }
  }
  
  # Parse audit events for security monitoring
  if "audit" in [tags] {
    mutate {
      add_field => { "security_event" => "true" }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "forgejo-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}
